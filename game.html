<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUCK TAG — DAMMY.EXE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#9ee7ff,#eef8ff);font-family:Inter,system-ui,sans-serif;color:#17212b}
.wrap{width:min(1100px,100%);margin:auto;padding:18px}.brand{font-weight:900;letter-spacing:3px;font-size:20px;margin-bottom:10px}
.game{position:relative;border:4px solid #17212b;border-radius:20px;overflow:hidden;box-shadow:0 12px 0 #17212b;background:#8fdcff}
canvas{display:block;width:100%;height:auto;image-rendering:auto}
.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#16243acc,#16243aee);z-index:5}
.card{width:min(520px,90%);padding:30px;border:4px solid #fff;border-radius:24px;background:#fff;box-shadow:0 12px 0 #101820;text-align:center}
.logo{font-size:48px;font-weight:1000;letter-spacing:2px;margin:0 0 5px}.sub{color:#637180;margin:0 0 22px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.mode{padding:16px 22px;border:3px solid #17212b;border-radius:14px;background:#f7fbff;font-weight:900;cursor:pointer;min-width:180px}.mode:hover,.mode.active{background:#ffe66d}.start{margin-top:18px;width:100%;padding:17px;border:0;border-radius:14px;background:#ff9f43;color:#17212b;font-size:18px;font-weight:1000;cursor:pointer}
.help{margin-top:12px;color:#637180;font-size:13px}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#17212b;color:#fff;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{flex:1;min-width:110px;min-height:46px;border:3px solid #17212b;border-radius:12px;background:#fff;font-weight:900}.msg{min-height:24px;font-weight:800;margin:10px 2px}
@media(max-width:600px){.logo{font-size:34px}.card{padding:20px}.mode{min-width:145px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">DAMMY.EXE // DUCK TAG</div>
<div class="game">
<canvas id="screen" width="1100" height="650"></canvas>
<div id="menu" class="menu">
 <div class="card">
  <div class="logo">🦆 DUCK TAG</div>
  <p class="sub">Run. Dodge. TAG the other ducks.</p>
  <div class="row">
   <button class="mode active" id="two">👥 TWO DUCKS</button>
   <button class="mode" id="bots">🤖 VS BOTS</button>
  </div>
  <button class="start" id="start">START GAME</button>
  <div class="help">2 players: Duck 1 uses WASD · Duck 2 uses arrow keys<br>Bot mode: you are Duck 1 · bots chase the tagged duck</div>
 </div>
</div>
</div>
<div class="hud"><span id="status">Choose a mode and start.</span><span id="timer">60</span></div>
<div class="controls">
<button id="left">◀</button><button id="right">▶</button><button id="jump">JUMP</button><button id="tag">TAG</button><button id="restart">RESTART</button>
</div>
<div id="msg" class="msg">First duck to survive the timer without being tagged wins!</div>
</div>
<script>
(()=>{const c=document.getElementById('screen'),x=c.getContext('2d'),menu=document.getElementById('menu'),status=document.getElementById('status'),timerEl=document.getElementById('timer'),msg=document.getElementById('msg');
const W=1100,H=650,G=0.55;let mode='two',running=false,last=0,timeLeft=60,tagged=0,shake=0,particles=[],keys={},mobile={};let ducks=[];
const arena={left:55,right:1045,top:80,bottom:585};
function say(s){msg.textContent=s}
function reset(){timeLeft=60;tagged=0;shake=0;particles=[];ducks=[];
 const add=(name,x,y,body,ctrl,bot=false)=>ducks.push({name,x,y,vx:0,vy:0,dir:1,body,ctrl,bot,tag:false,cool:0,ai:Math.random()*10});
 add('Duck 1',220,450,'#ffd83d',{l:'a',r:'d',j:'w'});
 if(mode==='two')add('Duck 2',850,450,'#78d7ff',{l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp'});
 else{add('Bot Blue',760,420,'#78d7ff',{},true);add('Bot Pink',900,470,'#ff91c8',{},true)}
 ducks[0].tag=true; status.textContent=mode==='two'?'Duck 1 is IT!':'Duck 1 is IT!';say('TAG the other duck before they get away!');running=true;menu.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function ground(y){return y<arena.bottom}
function jump(d){if(d.y>=arena.bottom-48){d.vy=-11}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function tagAttempt(d){if(!running||d.cool>0)return;for(const o of ducks)if(o!==d&&dist(d,o)<70){d.tag=true;o.tag=false;tagged=ducks.indexOf(d);say(d.name+' is IT!');d.cool=35;particles.push({x:o.x,y:o.y,life:35});return}}
function botAI(d){let target=ducks.find(o=>o.tag)!==d?ducks.find(o=>o.tag):ducks[0];if(!target)return;let dx=target.x-d.x;d.vx+=Math.sign(dx)*.22;d.dir=dx<0?-1:1;if(Math.abs(dx)<85&&Math.random()<.08)tagAttempt(d);if(Math.random()<.018&&d.y>=arena.bottom-50)jump(d)}
function update(dt){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;running=false;let it=ducks.find(d=>d.tag);say(it?it.name+' is IT when time ran out!':'Time!');menu.style.display='flex';document.querySelector('.logo').textContent='🏆 ROUND OVER';document.getElementById('start').textContent='PLAY AGAIN';return}
 for(const d of ducks){if(d.cool>0)d.cool--;if(d.bot)botAI(d);else{if(keys[d.ctrl.l]||mobile.left)d.vx-=.45;if(keys[d.ctrl.r]||mobile.right)d.vx+=.45;if(keys[d.ctrl.j]||mobile.jump)jump(d)}d.vx*=.86;d.vx=Math.max(-6,Math.min(6,d.vx));d.x+=d.vx;d.vy+=G;d.y+=d.vy;if(d.y>arena.bottom-48){d.y=arena.bottom-48;d.vy=0}d.x=Math.max(arena.left+25,Math.min(arena.right-25,d.x));if(Math.abs(d.vx)>.1)d.dir=d.vx<0?-1:1}
 if(mode==='two'&&Math.random()<.01){let a=ducks.find(d=>d.tag);if(a&&dist(a,ducks.find(d=>d!==a))<58)tagAttempt(a)}
 if(mode==='two'&&mobile.tag)tagAttempt(ducks[0]);
 for(let i=particles.length-1;i>=0;i--){particles[i].life--;if(particles[i].life<=0)particles.splice(i,1)}
 timerEl.textContent=Math.ceil(timeLeft);status.textContent=ducks.map(d=>(d.tag?'★ ':'')+d.name).join('  •  ');render()}
function duck(d){x.save();x.translate(d.x,d.y);x.scale(d.dir,1);
 // shadow
 x.fillStyle='#0003';x.beginPath();x.ellipse(0,48,35,8,0,0,Math.PI*2);x.fill();
 // tail
 x.fillStyle=d.body;x.beginPath();x.ellipse(-28,2,15,12,-.6,0,Math.PI*2);x.fill();
 // body
 x.beginPath();x.ellipse(0,18,34,29,0,0,Math.PI*2);x.fill();
 // wing
 x.fillStyle='#00000012';x.beginPath();x.ellipse(-8,20,21,14,-.35,0,Math.PI*2);x.fill();
 // neck/head
 x.fillStyle=d.body;x.beginPath();x.ellipse(15,-17,27,27,0,0,Math.PI*2);x.fill();
 // head highlight
 x.fillStyle='#ffffff66';x.beginPath();x.ellipse(22,-25,11,8,-.4,0,Math.PI*2);x.fill();
 // eye
 x.fillStyle='#17212b';x.beginPath();x.arc(24,-22,4,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(25,-23,1.3,0,Math.PI*2);x.fill();
 // beak
 x.fillStyle='#f28c28';x.beginPath();x.moveTo(39,-15);x.lineTo(57,-9);x.lineTo(39,-3);x.closePath();x.fill();
 // feet
 x.strokeStyle='#f28c28';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(-10,43);x.lineTo(-15,52);x.moveTo(10,43);x.lineTo(15,52);x.stroke();
 // tag bubble
 if(d.tag){x.fillStyle='#ff5d5d';x.beginPath();x.arc(0,-58,14,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('!',0,-52)}
 x.restore()}
function render(){x.clearRect(0,0,W,H);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8cddff');g.addColorStop(1,'#d9f5ff');x.fillStyle=g;x.fillRect(0,0,W,H);
 // sun/clouds
 x.fillStyle='#ffe37b';x.beginPath();x.arc(930,105,42,0,Math.PI*2);x.fill();
 x.fillStyle='#ffffff99';for(const p of [[150,120,60],[400,165,45],[700,115,70]]){x.beginPath();x.arc(p[0],p[1],p[2],0,Math.PI*2);x.fill()}
 // distant hills
 x.fillStyle='#8bcf9b';x.beginPath();x.moveTo(0,430);for(let i=0;i<=1100;i+=55)x.lineTo(i,390-Math.sin(i/100)*55);x.lineTo(1100,650);x.lineTo(0,650);x.fill();
 // arena
 x.fillStyle='#8fd06a';x.fillRect(arena.left,arena.top,arena.right-arena.left,arena.bottom-arena.top);
 x.fillStyle='#6fbd55';for(let i=0;i<70;i++){let px=70+(i*83)%950,py=120+(i*47)%450;x.fillRect(px,py,4,2)}
 x.fillStyle='#c9e78a';x.fillRect(arena.left,arena.bottom-15,arena.right-arena.left,15);
 x.strokeStyle='#fff8';x.lineWidth=5;x.strokeRect(arena.left,arena.top,arena.right-arena.left,arena.bottom-arena.top);
 for(const d of ducks)duck(d);
 for(const p of particles){x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('💥',p.x-12,p.y-50)}
 // center tag hint
 x.fillStyle='#17212b99';x.font='bold 14px system-ui';x.textAlign='center';x.fillText('GET CLOSE AND PRESS TAG',W/2,arena.top+28);x.textAlign='left'}
function loop(now){if(!running)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}
function choose(m){mode=m;document.getElementById('two').classList.toggle('active',m==='two');document.getElementById('bots').classList.toggle('active',m==='bots')}
document.getElementById('two').onclick=()=>choose('two');document.getElementById('bots').onclick=()=>choose('bots');document.getElementById('start').onclick=reset;document.getElementById('restart').onclick=()=>{document.querySelector('.logo').textContent='🦆 DUCK TAG';document.getElementById('start').textContent='START GAME';menu.style.display='flex';running=false};
window.onkeydown=e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')tagAttempt(ducks[0]);if(e.key==='r'||e.key==='R'&&!running)reset()};window.onkeyup=e=>keys[e.key]=false;
function hold(id,k){let b=document.getElementById(id);b.onpointerdown=()=>mobile[k]=true;b.onpointerup=b.onpointercancel=()=>mobile[k]=false}
hold('left','left');hold('right','right');hold('jump','jump');document.getElementById('tag').onclick=()=>tagAttempt(ducks[0]);
document.getElementById('restart').onclick=()=>{running=false;menu.style.display='flex';document.querySelector('.logo').textContent='🦆 DUCK TAG';document.getElementById('start').textContent='START GAME';say('Pick TWO DUCKS or VS BOTS.');};
render();
})();</script>
</body>
</html>
