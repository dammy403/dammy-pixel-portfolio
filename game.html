<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL REALMS — DAMMY.EXE</title>
<style>
:root{--bg:#070a10;--panel:#111827;--ink:#f7f4e8;--muted:#a8b0c2;--line:#293449;--accent:#6cf0c2;--pink:#ff79c6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2942,#070a10 55%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{width:min(100%,1000px);margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.title{font-weight:900;letter-spacing:2px}.stats{color:var(--muted);font-size:12px}
.game{border:3px solid var(--line);background:#101820;box-shadow:8px 8px 0 #000;overflow:hidden}.screen{display:block;width:100%;height:auto;image-rendering:pixelated;background:#79c8ef;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:7px;padding:8px;background:var(--panel);border-top:2px solid var(--line)}button{font:inherit;color:var(--ink);background:#0c1320;border:2px solid var(--line);min-height:44px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--accent)}button.active{border-color:var(--accent);color:var(--accent)}.slot{min-width:72px}.slot small{display:block;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.wide{grid-column:span 2}.help{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0}.msg{min-height:20px;color:var(--accent);font-size:12px;margin:8px 0}
@media(max-width:600px){.controls{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 1}.wrap{padding:10px}.stats{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="title">PIXEL REALMS // DAMMY.EXE</div><div id="stats" class="stats"></div></div>
<div class="game"><canvas id="screen" class="screen" width="960" height="576" aria-label="Pixel Realms game world"></canvas><div id="bar" class="bar"></div></div>
<div class="controls">
<button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button><button id="jump">⬆ JUMP</button><button id="action">⛏ MINE</button>
<button id="build" class="wide">▣ BUILD BLOCK</button><button id="new" class="wide">↻ NEW WORLD</button>
</div>
<div id="msg" class="msg" aria-live="polite"></div>
<div class="help">A/D or arrow keys: move · W/Space: jump · E: mine · F: build · 1–6: choose block. Collect crystals, build a shelter, avoid slimes, and explore. On mobile, use the buttons. Your world exists only while this page is open.</div>
</div>
<script>
(()=>{const c=document.getElementById('screen'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),bar=document.getElementById('bar'),msg=document.getElementById('msg');const TILE=24,COLS=40,ROWS=24,W=COLS*TILE,H=ROWS*TILE;let map,enemies,keys={},cam=0,sel=1,day=1,time=0,score=0,hp=100,inv={1:8,2:10,3:0,4:0,5:0,6:0},player={x:5,y:7,vx:0,vy:0,on:false};const names={1:'Grass',2:'Stone',3:'Ore',4:'Gold',5:'Crystal',6:'Brick'},colors={1:'#58a65c',2:'#71665a',3:'#9a7c68',4:'#d7b64c',5:'#52d6d6',6:'#b85a78'};function say(t){msg.textContent=t}function reset(){map=Array.from({length:ROWS},(_,y)=>Array.from({length:COLS},(_,x)=>{if(y<12)return 0;if(y===12)return 1;if(y<17)return Math.random()<.14?3:2;return Math.random()<.08?4:2}));for(let i=0;i<35;i++){const x=2+Math.floor(Math.random()*(COLS-4)),y=4+Math.floor(Math.random()*7);map[y][x]=Math.random()<.5?5:0}for(let x=0;x<COLS;x++){map[11][x]=x%9===0?0:map[11][x]}enemies=[];for(let i=0;i<6;i++)enemies.push({x:12+i*4+Math.random()*2,y:10,vx:0,vy:0,on:false,alive:true});player={x:5,y:8,vx:0,vy:0,on:false};cam=0;day=1;time=0;score=0;hp=100;inv={1:8,2:10,3:0,4:0,5:0,6:0};sel=1;say('New world created. Find a crystal and build something cool.');render()}function solid(x,y){return x<0||x>=COLS||y>=ROWS||(y>=0&&map[y][x]!==0)}function hit(x,y,w=.72,h=.9){const l=Math.floor(x),r=Math.floor(x+w),t=Math.floor(y),b=Math.floor(y+h);return solid(l,t)||solid(r,t)||solid(l,b)||solid(r,b)}function moveEntity(o){o.vy+=.018;let nx=o.x+o.vx;if(!hit(nx,o.y))o.x=Math.max(0,Math.min(COLS-1.1,nx));else o.vx=0;let ny=o.y+o.vy;if(!hit(o.x,ny)){o.y=ny;o.on=false}else{o.on=o.vy>0;o.vy=0}}function update(){if(hp<=0)return;let left=keys.a||keys.ArrowLeft,right=keys.d||keys.ArrowRight;if(left)player.vx-=.035;if(right)player.vx+=.035;player.vx*=.84;if((keys.w||keys.ArrowUp||keys[' '])&&player.on){player.vy=-.31;player.on=false}moveEntity(player);for(const e of enemies){if(!e.alive)continue;const dx=player.x-e.x;e.vx+=Math.sign(dx)*.006;e.vx=Math.max(-.055,Math.min(.055,e.vx));if(Math.abs(dx)<.8&&Math.abs(player.y-e.y)<1){hp=Math.max(0,hp-0.08)}if(Math.random()<.006&&e.on)e.vy=-.25;moveEntity(e)}time++;if(time%1800===0)day++;cam=Math.max(0,Math.min(COLS-40,player.x-20));render();requestAnimationFrame(update)}function target(){let dir=(keys.a||keys.ArrowLeft)?-1:1;return{x:Math.floor(player.x+dir*1.25),y:Math.floor(player.y+.45)}}function mine(){const q=target();if(q.x<0||q.x>=COLS||q.y<0||q.y>=ROWS||!map[q.y][q.x]){say('Nothing there to mine.');return}const b=map[q.y][q.x];map[q.y][q.x]=0;inv[b]++;score+=b===5?50:5;say('Mined '+names[b]+(b===5?' — rare crystal!':''));render()}function build(){const q=target();if(q.x<0||q.x>=COLS||q.y<0||q.y>=ROWS||map[q.y][q.x]){say('That spot is occupied.');return}if((inv[sel]||0)<=0){say('You need more '+names[sel]+'.');return}map[q.y][q.x]=sel;inv[sel]--;score+=2;say('Built with '+names[sel]+'.');render()}function choose(n){sel=n;render()}function render(){const night=(time%1800)>1250;ctx.fillStyle=night?'#182449':'#79c8ef';ctx.fillRect(0,0,W,H);ctx.fillStyle=night?'#eee6a0':'#ffe08a';ctx.beginPath();ctx.arc((night?850:110),70,night?18:28,0,Math.PI*2);ctx.fill();for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const b=map[y][x];if(!b)continue;const sx=(x-cam)*TILE,sy=y*TILE;ctx.fillStyle=colors[b];ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(sx,sy,TILE,3);if(b===5){ctx.fillStyle='#dfffff';ctx.fillRect(sx+7,sy+7,7,7)}}for(const e of enemies){if(!e.alive)continue;ctx.fillStyle='#9c5de5';ctx.fillRect((e.x-cam)*TILE,e.y*TILE+7,18,15);ctx.fillStyle='#fff';ctx.fillRect((e.x-cam)*TILE+4,e.y*TILE+10,4,4);ctx.fillRect((e.x-cam)*TILE+12,e.y*TILE+10,4,4)}const px=(player.x-cam)*TILE,py=player.y*TILE;ctx.fillStyle='#222832';ctx.fillRect(px+4,py+7,15,16);ctx.fillStyle='#f0b27a';ctx.fillRect(px+6,py,11,10);ctx.fillStyle='#6cf0c2';ctx.fillRect(px+5,py+15,13,8);const q=target();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect((q.x-cam)*TILE,q.y*TILE,TILE,TILE);stats.textContent='DAY '+day+' • '+Math.ceil(hp)+' HP • SCORE '+score+(night?' • NIGHT':' • DAY');bar.innerHTML='';for(let i=1;i<=6;i++){const b=document.createElement('button');b.className='slot'+(i===sel?' active':'');b.type='button';b.innerHTML=i+' '+names[i]+'<small>'+((inv[i]||0))+'</small>';b.onclick=()=>choose(i);bar.appendChild(b)}}function bindHold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}bindHold('left','ArrowLeft');bindHold('right','ArrowRight');document.getElementById('jump').onclick=()=>{keys.ArrowUp=true;setTimeout(()=>keys.ArrowUp=false,120)};document.getElementById('action').onclick=mine;document.getElementById('build').onclick=build;document.getElementById('new').onclick=reset;window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')mine();if(e.key==='f'||e.key==='F')build();if(e.key>='1'&&e.key<='6')choose(Number(e.key));if(e.key==='r'||e.key==='R')reset()});window.addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,qx=Math.floor(mx/r.width*COLS+cam),qy=Math.floor(my/r.height*ROWS);if(Math.abs(qx-player.x)<3&&Math.abs(qy-player.y)<2&&map[qy]?.[qx]){const b=map[qy][qx];map[qy][qx]=0;inv[b]++;score+=5;say('Mined '+names[b]+'.');render()}});reset();requestAnimationFrame(update)})();
</script>
</body>
</html>
