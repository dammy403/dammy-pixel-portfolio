<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL REALMS — DAMMY.EXE</title>
<style>
:root{--bg:#070a10;--panel:#111827;--ink:#f7f4e8;--muted:#a8b0c2;--line:#293449;--accent:#6cf0c2;--pink:#ff79c6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2942,#070a10 55%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{width:min(100%,1000px);margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.title{font-weight:900;letter-spacing:2px}.stats{color:var(--muted);font-size:12px}
.game{border:3px solid var(--line);background:#101820;box-shadow:8px 8px 0 #000;overflow:hidden}.screen{display:block;width:100%;height:auto;image-rendering:pixelated;background:#79c8ef;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:7px;padding:8px;background:var(--panel);border-top:2px solid var(--line)}button{font:inherit;color:var(--ink);background:#0c1320;border:2px solid var(--line);min-height:44px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--accent)}button.active{border-color:var(--accent);color:var(--accent)}.slot{min-width:72px}.slot small{display:block;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.wide{grid-column:span 2}.help{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0}.msg{min-height:20px;color:var(--accent);font-size:12px;margin:8px 0}
@media(max-width:600px){.controls{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 1}.wrap{padding:10px}.stats{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="title">PIXEL REALMS // DAMMY.EXE</div><div id="stats" class="stats"></div></div>
<div class="game"><canvas id="screen" class="screen" width="960" height="576" aria-label="Pixel Realms game world"></canvas><div id="bar" class="bar"></div></div>
<div class="controls">
<button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button><button id="jump">⬆ JUMP</button><button id="action">⛏ MINE</button>
<button id="build" class="wide">▣ BUILD BLOCK</button><button id="new" class="wide">↻ NEW WORLD</button>
</div>
<div id="msg" class="msg" aria-live="polite"></div>
<div class="help">A/D or arrow keys: move · W/Space: jump · E: mine · F: build · 1–6: choose block. Collect crystals, build a shelter, avoid slimes, and explore. On mobile, use the buttons. Your world exists only while this page is open.</div>
</div>
<script>
(()=>{const c=document.getElementById('screen'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),bar=document.getElementById('bar'),msg=document.getElementById('msg');
const T=16,CW=90,CH=38,W=CW*T,H=CH*T;let map,fg,decor,slimes,particles,keys={},cam=0,sel=2,day=1,t=0,score=0,hp=100,maxhp=100,inv,player,paused=false;
const B={1:['Grass','#4f9b48'],2:['Dirt','#76502f'],3:['Stone','#555d68'],4:['Copper','#b86e45'],5:['Iron','#a9b2bd'],6:['Crystal','#48d5e5'],7:['Wood','#85522d'],8:['Leaves','#3f8148'],9:['Brick','#a34e5f'],10:['Sand','#c9b26b'],11:['Snow','#d9eef1']};
function say(s){msg.textContent=s}
function terrain(){map=Array.from({length:CH},()=>Array(CW).fill(0));fg=Array.from({length:CH},()=>Array(CW).fill(0));decor=Array.from({length:CH},()=>Array(CW).fill(0));
 let h=15;for(let x=0;x<CW;x++){h+=Math.floor(Math.random()*3)-1;h=Math.max(10,Math.min(19,h));let biome=x<28?0:x<60?1:2;for(let y=h;y<CH;y++){let b=y===h?(biome===2?10:1):(y<h+4?2:3);map[y][x]=b;if(y>h+4&&Math.random()<.055)map[y][x]=Math.random()<.45?4:5;if(y>h+7&&Math.random()<.018)map[y][x]=6}}
 for(let x=3;x<CW-3;x++){let ground=map.findIndex((r,y)=>y>5&&r[x]);if(ground>0&&Math.random()<.08&&x>4){for(let k=1;k<5&&ground-k>1;k++)map[ground-k][x]=7;for(let dx=-2;dx<=2;dx++)for(let dy=1;dy<=3;dy++)if(Math.random()<.72&&ground-4+dy>=0)map[ground-4+dy][x+dx]=8}}
 // caves
 for(let i=0;i<34;i++){let cx=5+Math.random()*(CW-10),cy=18+Math.random()*15,rx=2+Math.random()*4,ry=1+Math.random()*3;for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++)if(((x-cx)/(rx))**2+((y-cy)/(ry))**2<1)map[y]?.[x]&&(map[y][x]=0)}
 player={x:6,y:7,vx:0,vy:0,on:false,dir:1};slimes=[];particles=[];for(let i=0;i<12;i++){let x=12+Math.random()*72;slimes.push({x,y:6,vx:0,vy:0,on:false,hp:3,hit:0})}inv={1:8,2:25,3:12,4:0,5:0,6:0,7:12,8:0,9:0,10:0,11:0};cam=0;hp=maxhp;score=0;day=1;t=0;sel=2;say('A fresh world. Mine deep, craft, build, and survive the night.');render()}
function solid(x,y){return x<0||x>=CW||y>=CH||(y>=0&&map[y][x]!==0)}
function hit(o,nx,ny){let w=.72,h=.9,l=Math.floor(nx),r=Math.floor(nx+w),q=Math.floor(ny),bb=Math.floor(ny+h);return solid(l,q)||solid(r,q)||solid(l,bb)||solid(r,bb)}
function move(o){o.vy+=.018;let nx=o.x+o.vx;if(!hit(o,nx,o.y))o.x=Math.max(0,Math.min(CW-1.1,nx));else o.vx=0;let ny=o.y+o.vy;if(!hit(o,o.x,ny)){o.y=ny;o.on=false}else{o.on=o.vy>0;o.vy=0}}
function target(){return{x:Math.floor(player.x+player.dir*1.35),y:Math.floor(player.y+.5)}}
function drop(x,y,n){for(let i=0;i<n;i++)particles.push({x:x*T,y:y*T,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:30,txt:'+'+B[n][0]})}
function mine(){let q=target(),b=map[q.y]?.[q.x];if(!b){say('Swing! Nothing there.');return}if(b===8){b=8}map[q.y][q.x]=0;inv[b]=(inv[b]||0)+1;score+=b===6?100:10;drop(q.x,q.y,b);say('Mined '+B[b][0]+(b===6?' — RARE CRYSTAL!':''));render()}
function build(){let q=target();if(map[q.y]?.[q.x]){say('Blocked.');return}if((inv[sel]||0)<1){say('Need '+B[sel][0]+'.');return}map[q.y][q.x]=sel;inv[sel]--;score+=3;say('Built '+B[sel][0]+'.');render()}
function craft(){if((inv[7]||0)>=4&&(inv[3]||0)>=2){inv[7]-=4;inv[3]-=2;inv[9]=(inv[9]||0)+4;say('Crafted 4 Brick Blocks from wood + stone.')}else say('Crafting recipe: 4 Wood + 2 Stone = 4 Brick.')}
function jump(){if(player.on){player.vy=-.32;player.on=false}}
function hurt(n){hp=Math.max(0,hp-n);say('Ouch! Slime hit you.');for(let i=0;i<8;i++)particles.push({x:player.x*T,y:player.y*T,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:25,txt:'*'})}
function update(){if(hp<=0){render();return}let L=keys.a||keys.ArrowLeft,R=keys.d||keys.ArrowRight;if(L){player.vx-=.04;player.dir=-1}if(R){player.vx+=.04;player.dir=1}player.vx*=.82;if(keys.w||keys.ArrowUp||keys[' '])jump();move(player);
 for(const e of slimes){if(e.hp<=0)continue;let dx=player.x-e.x;e.vx+=Math.sign(dx)*.004;e.vx=Math.max(-.06,Math.min(.06,e.vx));if(Math.random()<.008&&e.on)e.vy=-.25;move(e);if(Math.abs(dx)<.8&&Math.abs(player.y-e.y)<1&&e.hit<=0){hurt(8);e.hit=40}e.hit--}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;if(p.life<=0)particles.splice(i,1)}
 t++;if(t%2100===0)day++;cam=Math.max(0,Math.min(CW-60,player.x-30));render();requestAnimationFrame(update)}
function tile(b,x,y){let X=(x-cam)*T,Y=y*T;if(X<-T||X>W)return;ctx.fillStyle=B[b][1];ctx.fillRect(X,Y,T,T);ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(X,Y,T,2);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(X+T-2,Y,2,T);if(b===3){ctx.fillStyle='#68717b';ctx.fillRect(X+3,Y+4,3,3);ctx.fillRect(X+10,Y+9,2,2)}if(b===4||b===5){ctx.fillStyle=b===4?'#f08b58':'#e7faff';ctx.fillRect(X+4,Y+5,3,3);ctx.fillRect(X+10,Y+10,3,3)}if(b===6){ctx.fillStyle='#bfffff';ctx.fillRect(X+5,Y+5,6,6)}}
function render(){let night=(t%2100)>1450;ctx.fillStyle=night?'#10182f':'#77c9ef';ctx.fillRect(0,0,W,H);ctx.fillStyle=night?'#f1e8a7':'#ffe18a';ctx.beginPath();ctx.arc(night?820:110,65,night?17:25,0,7);ctx.fill();
 for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(map[y][x])tile(map[y][x],x,y);
 for(const e of slimes)if(e.hp>0){let X=(e.x-cam)*T,Y=e.y*T;ctx.fillStyle='#a85de0';ctx.fillRect(X+1,Y+5,14,11);ctx.fillStyle='#fff';ctx.fillRect(X+4,Y+8,3,3);ctx.fillRect(X+10,Y+8,3,3);ctx.fillStyle='#40204e';ctx.fillRect(X+5,Y+12,7,2)}
 let X=(player.x-cam)*T,Y=player.y*T;ctx.fillStyle='#1d2630';ctx.fillRect(X+3,Y+6,11,14);ctx.fillStyle='#f0b27a';ctx.fillRect(X+5,Y,9,9);ctx.fillStyle='#6cf0c2';ctx.fillRect(X+4,Y+12,10,8);ctx.fillStyle='#242b35';ctx.fillRect(X+(player.dir>0?12:1),Y+8,4,3);
 for(const p of particles){ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText(p.txt,p.x-cam*T,p.y)}
 let q=target();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect((q.x-cam)*T,q.y*T,T,T);
 stats.textContent=(hp>0?'DAY '+day+' • HP '+Math.ceil(hp)+'/'+maxhp+' • SCORE '+score+(night?' • NIGHT':' • DAY'):'GAME OVER • PRESS R TO RESTART');
 bar.innerHTML='';for(let i=1;i<=11;i++){let z=document.createElement('button');z.className='slot'+(i===sel?' active':'');z.type='button';z.innerHTML=i+' '+B[i][0]+'<small>'+(inv[i]||0)+'</small>';z.onclick=()=>{sel=i;render()};bar.appendChild(z)}}
function hold(id,k){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))}
hold('left','ArrowLeft');hold('right','ArrowRight');document.getElementById('jump').onclick=jump;document.getElementById('action').onclick=mine;document.getElementById('build').onclick=build;document.getElementById('new').onclick=terrain;
document.getElementById('new').onclick=terrain;document.getElementById('action').onclick=mine;
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')mine();if(e.key==='f'||e.key==='F')build();if(e.key==='c'||e.key==='C')craft();if(e.key==='r'||e.key==='R')terrain();if(e.key>='1'&&e.key<='9'){sel=+e.key;render()}});
window.addEventListener('keyup',e=>keys[e.key]=false);terrain();requestAnimationFrame(update)})();
</script>
</body>
</html>
